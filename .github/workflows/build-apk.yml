# Builds the mOS debug APK on GitHub's servers and publishes it as a Release.
name: Build mOS APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Bundle Inter font
        run: python3 tools/bundle_fonts.py

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon assembleDebug 2>&1 | tee build.log

      - name: Publish APK as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk mOS-1.0-debug.apk
          gh release create "build-${{ github.run_number }}" mOS-1.0-debug.apk \
            --title "mOS 1.0 (build ${{ github.run_number }})" \
            --notes "Debug APK for Samsung Galaxy A06. Built from ${{ github.sha }}." \
            --latest

      - name: Save build log on failure
        if: failure()
        shell: bash
        run: |
          (tail -n 400 build.log 2>/dev/null || echo "Build failed before Gradle ran") > /tmp/failure.log
          git config user.name "mOS build"
          git config user.email "build@users.noreply.github.com"
          git checkout --orphan build-log
          git rm -rf --cached . > /dev/null
          cp /tmp/failure.log failure.log
          git add failure.log
          git commit -m "Build ${{ github.run_number }} failed"
          git push -f origin build-log
